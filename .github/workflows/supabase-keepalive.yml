name: Supabase Keep-Alive

# Free-tier Supabase projects pause after ~7 days without database activity.
# This workflow runs a real query daily so the project never goes inactive.

on:
  schedule:
    - cron: "17 9 * * *" # daily at 09:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (counts as database activity)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/tasks?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Supabase responded with HTTP $code"
          # 200 = query ran; anything else means the project is paused or misconfigured
          [ "$code" = "200" ]

      - name: Checkout
        uses: actions/checkout@v4

      # GitHub disables scheduled workflows after 60 days without repo activity.
      # If the last commit is >50 days old, push an empty commit to stay active.
      - name: Keep workflow schedule alive
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          days=$(( (now - last) / 86400 ))
          echo "Last commit was $days days ago"
          if [ "$days" -ge 50 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keep scheduled workflows active"
            git push
          fi
