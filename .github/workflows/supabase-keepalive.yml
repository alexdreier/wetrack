name: Supabase Keep-Alive

# Free-tier Supabase projects pause after 7 days without "sufficient activity".
#
# The previous version of this workflow ran a daily one-row anon SELECT and
# reported success every single day. On 2026-08-27 Supabase still scheduled
# WETrack for pausing, which means those reads never counted. A green check that
# proves nothing is worse than no check, so this version WRITES and then
# verifies the write actually landed.

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Beat the WETrack heartbeat (a real write, then verified)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          before=$(curl -sS -X POST "$SUPABASE_URL/rest/v1/rpc/beat" \
            -H "apikey: $SERVICE_KEY" -H "Authorization: Bearer $SERVICE_KEY" \
            -H "Content-Type: application/json" -d '{}')
          echo "first beat:  $before"
          b1=$(echo "$before" | python3 -c 'import sys,json; print(json.load(sys.stdin)["beats"])')

          second=$(curl -sS -X POST "$SUPABASE_URL/rest/v1/rpc/beat" \
            -H "apikey: $SERVICE_KEY" -H "Authorization: Bearer $SERVICE_KEY" \
            -H "Content-Type: application/json" -d '{}')
          echo "second beat: $second"
          b2=$(echo "$second" | python3 -c 'import sys,json; print(json.load(sys.stdin)["beats"])')

          # The counter MUST advance. A 2xx alone is exactly the false assurance
          # that let this sit broken for weeks.
          if [ "$b2" -le "$b1" ]; then
            echo "::error::heartbeat did not advance ($b1 -> $b2); the write is not landing"
            exit 1
          fi
          echo "heartbeat advanced $b1 -> $b2"

      - name: Checkout
        uses: actions/checkout@v4

      # GitHub disables scheduled workflows after 60 days without repo activity.
      - name: Keep workflow schedule alive
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          days=$(( (now - last) / 86400 ))
          echo "Last commit was $days days ago"
          if [ "$days" -ge 50 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keep scheduled workflows active"
            git push
          fi
